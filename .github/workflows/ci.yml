---
name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# InfraHouse's self-hosted runners are reused from job to job: each job installs into RUNNER_TEMP, which the runner
# empties at the start and end of every job, never into the runner's shared Python, npm cache or home.
jobs:
  checks:
    runs-on: ["self-hosted", "Linux", "noble"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: A virtualenv of the job's
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

  plugin-validate:
    runs-on: ["self-hosted", "Linux", "noble"]
    env:
      # Claude Code writes its settings under HOME, and npm its cache under its own: both the job's.
      HOME: ${{ runner.temp }}/home
      npm_config_cache: ${{ runner.temp }}/npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Claude Code, at ci/package.json's release
        run: |
          mkdir -p "$HOME"
          npm ci --prefix ci --no-audit --no-fund

      - name: Claude Code's validator on the marketplace and the plugin
        run: make validate CLAUDE=ci/node_modules/.bin/claude
