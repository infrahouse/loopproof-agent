# The repository's checks: no package is built from it.

[tool.black]
line-length = 120

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'tests')"

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "--strict-markers"
